<label for="some-input" class="text-primaryWhite font-semibold text-lg mx-4 p-3 min-h-9">
    {{ name+' :' }}
    <input
      [ngClass]="['outline-none rounded-md bg-transparent text-white border font-body h-9 mx-3 max-w-8/12 p-3' , error?'border-red-500':'']"
      name="some-input"
      type="{{ type }}"
      (input)="onChange($event)"
    />
  </label>
