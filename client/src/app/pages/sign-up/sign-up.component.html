<div class="h-fit min-w-fit flex flex-col items-center justify-center shadow-black shadow-2xl rounded-2xl py-12 gap-10 bg-black/60 border border-black ">
    <h3 class="font-heading text-primaryWhite inline-block font-bold text-3xl">Sign Up</h3>
    <div class="flex items-center px-3">
        <app-input name="First Name"  type="text" (inputValue)="newUser.first_name = $event"></app-input>
        <app-input name="Last Name"  type="text" (inputValue)="newUser.last_name = $event"></app-input>
    </div>

    <div class="flex items-center px-3">
        <app-input name="Email"  type="email" (inputValue)="newUser.email = $event"></app-input>
        <app-input name="Username"  type="text" (inputValue)="newUser.user_name=$event"></app-input>
    </div>
    <div class="flex items-center px-3">
        <app-input type="password" [error]="error" name="Password" (inputValue)="onChangePassword($event)"></app-input>
         <label for="password-field" class="flex items-center text-white font-semibold mx-2">
            Password : <div [ngClass]="['flex items-center border ml-2 h-9 rounded-lg p-2',error?'border-red-500':'']">
                 <input [type]="showPassword?'text':'password'" class="outline-none px-2 bg-transparent" (input)="onChangeConfirmPassword($event)">
                 <fa-icon (click)="showPassword=!showPassword" class="cursor-pointer text-white min-w-5" [icon]="showPassword? passwordNotVisible:passwordVisible"></fa-icon>
             </div>
         </label>
    </div>
    <button class="user-btn" (click)="onCrateUser()">Sign up</button>
    <p (click)="this.router.navigateByUrl( '/auth')" class=" text-body text-white text-lg cursor-pointer font-normal hover:underline hover:text-primaryWhite">Already have an account? Sign In</p>
</div>
